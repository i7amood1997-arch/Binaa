<body>
  <div id="app"></div>
  <script>
    // Boot watchdog: if the app module never runs (most commonly because the JS file 404s —
    // files uploaded one folder too deep, or GitHub Pages still set to "GitHub Actions" as its
    // source so the branch upload isn't being served), the page would otherwise just sit blank
    // with no explanation. Show something actionable instead.
    (function () {
      var booted = false;
      window.__binaBooted = function () { booted = true; };
      setTimeout(function () {
        if (booted || document.getElementById('app').children.length) return;
        document.getElementById('app').innerHTML =
          '<div style="font-family:system-ui,sans-serif;direction:rtl;text-align:right;max-width:34rem;margin:0 auto;padding:2rem 1.25rem;line-height:1.7;color:#17211e">' +
          '<h1 style="font-size:1.3rem;margin:0 0 .75rem">التطبيق لم يُحمَّل</h1>' +
          '<p style="margin:0 0 1rem;color:#56625e">ملفات التطبيق لم تصل. غالباً أحد هذين السببين:</p>' +
          '<ol style="margin:0 0 1.25rem;padding-inline-start:1.25rem">' +
          '<li style="margin-bottom:.5rem"><b>مكان الملفات:</b> لازم <code>index.html</code> يكون في جذر المستودع مباشرة، مو داخل مجلد. افتح المستودع على GitHub — أول ملف بالقائمة لازم يكون <code>index.html</code>.</li>' +
          '<li><b>إعداد Pages:</b> من Settings ← Pages، لازم <b>Source</b> تكون <b>Deploy from a branch</b> (فرع <code>main</code>، مجلد <code>/ (root)</code>) — مو "GitHub Actions".</li>' +
          '</ol>' +
          '<button id="binaReset" style="min-height:48px;padding:0 1.1rem;border-radius:12px;border:1px solid #d6dcda;background:#fff;font:inherit;font-weight:600;cursor:pointer">مسح الذاكرة المؤقتة وإعادة المحاولة</button>' +
          '</div>';
        document.getElementById('binaReset').onclick = function () {
          var done = function () { location.reload(true); };
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }).then(function () {
              return window.caches ? caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }) : null;
            }).then(done).catch(done);
          } else done();
        };
      }, 6000);
    })();
  </script>
</body>
